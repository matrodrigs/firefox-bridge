name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: browser-actions/setup-firefox@v1
        id: firefox
      - run: npm ci
      - run: npm run build
      - run: npm run test:firefox
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-test-reports
          path: test-artifacts/**/report.json
